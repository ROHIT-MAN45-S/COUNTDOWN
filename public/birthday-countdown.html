<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Countdown Timer</title>
  <meta name="description" content="Personalized birthday countdown timer targeting September 2, 2026 at Midnight with live cards, dark glassmorphism styling, and celebration confetti.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #030712;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px;
    }

    /* Ambient background glows */
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }
    .glow-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #8b5cf6 0%, rgba(139, 92, 246, 0) 70%);
      top: -100px;
      left: -100px;
    }
    .glow-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #ec4899 0%, rgba(236, 72, 153, 0) 70%);
      bottom: -120px;
      right: -120px;
    }
    .glow-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #3b82f6 0%, rgba(59, 130, 246, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      text-align: center;
    }

    /* Glass Panel */
    .glass-box {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 36px 28px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    /* Top Input Form */
    .name-form {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 28px auto;
    }
    .name-input {
      flex: 1;
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }
    .name-input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    }
    .set-btn {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }
    .set-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
    }
    .set-btn:active {
      transform: translateY(1px);
    }

    /* Headers */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #c4b5fd;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .header-title {
      font-family: 'Outfit', sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @media (min-width: 640px) {
      .header-title {
        font-size: 44px;
      }
    }
    .target-badge {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 36px;
    }

    /* Grid for Cards */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }
    @media (min-width: 640px) {
      .timer-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
    }

    /* Individual Glass Timer Card */
    .timer-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.75) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .timer-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    }
    .timer-card:hover {
      transform: translateY(-3px);
      border-color: rgba(236, 72, 153, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .card-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
    }
    @media (min-width: 640px) {
      .card-number {
        font-size: 64px;
      }
    }
    .card-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #a855f7;
    }

    /* Celebration Box */
    .celebration-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      padding: 20px 0;
    }
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    .celebration-title {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, #f43f5e 0%, #ec4899 50%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 2s infinite ease-in-out;
    }
    @media (min-width: 640px) {
      .celebration-title {
        font-size: 54px;
      }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .celebration-sub {
      font-size: 18px;
      color: #e2e8f0;
      max-width: 520px;
      line-height: 1.6;
    }

    /* Footer Controls */
    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    .action-btn {
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      border-radius: 9999px;
      padding: 8px 18px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      background: rgba(55, 65, 81, 0.8);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>
  <div class="glow-sphere glow-3"></div>

  <div class="container">
    <div class="glass-box">
      <!-- Name Input Form (Hidden on Celebration) -->
      <form class="name-form" id="nameForm">
        <input 
          type="text" 
          id="nameInput" 
          class="name-input" 
          placeholder="Enter a birthday person's name..."
          autocomplete="off"
        />
        <button type="submit" class="set-btn" id="setNameBtn">Set Name</button>
      </form>

      <!-- Active Timer State -->
      <div id="timerSection">
        <div class="badge">✨ Milestone Countdown</div>
        <h1 class="header-title" id="headerTitle">COUNTDOWN TO YOUR BIRTHDAY</h1>
        <div class="target-badge">Target: September 2, 2026 at 00:00:00 (Midnight)</div>

        <div class="timer-grid">
          <div class="timer-card">
            <div class="card-number" id="daysVal">00</div>
            <div class="card-label">Days</div>
          </div>
          <div class="timer-card">
            <div class="card-number" id="hoursVal">00</div>
            <div class="card-label">Hours</div>
          </div>
          <div class="timer-card">
            <div class="card-number" id="minutesVal">00</div>
            <div class="card-label">Minutes</div>
          </div>
          <div class="timer-card">
            <div class="card-number" id="secondsVal">00</div>
            <div class="card-label">Seconds</div>
          </div>
        </div>
      </div>

      <!-- Celebration State (Shown when hits 0) -->
      <div id="celebrationSection" class="celebration-box">
        <div style="font-size: 64px; margin-bottom: -10px;">🎂 🎁 ✨</div>
        <h1 class="celebration-title" id="celebrationMessage">🎉 HAPPY BIRTHDAY! 🎉</h1>
        <p class="celebration-sub">
          Wishing you a wonderful year ahead filled with joy, happiness, and unforgettable moments!
        </p>
        <button class="action-btn" id="resetBtn" style="margin-top: 16px; border-color: #ec4899; color: #f472b6;">
          🔄 Back to Countdown Timer
        </button>
      </div>
    </div>

    <!-- Quick test controls -->
    <div class="footer-actions">
      <button class="action-btn" id="testZeroBtn">
        ⚡ Preview Celebration Mode
      </button>
    </div>
  </div>

  <script>
    // State
    let currentName = 'YOUR';
    let isTestZero = false;
    let confettiTimer = null;

    // Target Date: September 2, 2026 at 00:00:00 (Midnight)
    const TARGET_DATE = new Date(2026, 8, 2, 0, 0, 0);

    // Elements
    const nameForm = document.getElementById('nameForm');
    const nameInput = document.getElementById('nameInput');
    const headerTitle = document.getElementById('headerTitle');
    const timerSection = document.getElementById('timerSection');
    const celebrationSection = document.getElementById('celebrationSection');
    const celebrationMessage = document.getElementById('celebrationMessage');
    const testZeroBtn = document.getElementById('testZeroBtn');
    const resetBtn = document.getElementById('resetBtn');

    const daysEl = document.getElementById('daysVal');
    const hoursEl = document.getElementById('hoursVal');
    const minutesEl = document.getElementById('minutesVal');
    const secondsEl = document.getElementById('secondsVal');

    // Update Header Text & Document Title
    function updateDisplayName() {
      const clean = currentName.trim().toUpperCase();
      if (!clean || clean === 'YOUR') {
        headerTitle.innerText = 'COUNTDOWN TO YOUR BIRTHDAY';
        document.title = 'Countdown to Your Birthday';
        celebrationMessage.innerText = '🎉 HAPPY BIRTHDAY! 🎉';
      } else {
        const possessive = clean.endsWith('S') ? clean + "'" : clean + "'S";
        headerTitle.innerText = 'COUNTDOWN TO ' + possessive + ' BIRTHDAY';
        document.title = 'Countdown to ' + possessive + ' Birthday';
        celebrationMessage.innerText = '🎉 HAPPY BIRTHDAY, ' + clean + '! 🎉';
      }
    }

    // Set Name Event
    nameForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const val = nameInput.value.trim();
      currentName = val ? val : 'YOUR';
      updateDisplayName();
    });

    // Confetti Engine
    function startCelebrationConfetti() {
      if (typeof confetti !== 'undefined') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });

        if (confettiTimer) clearInterval(confettiTimer);
        confettiTimer = setInterval(function() {
          confetti({
            particleCount: 40,
            angle: 60,
            spread: 55,
            origin: { x: 0, y: 0.7 }
          });
          confetti({
            particleCount: 40,
            angle: 120,
            spread: 55,
            origin: { x: 1, y: 0.7 }
          });
        }, 2200);
      }
    }

    function stopConfetti() {
      if (confettiTimer) {
        clearInterval(confettiTimer);
        confettiTimer = null;
      }
    }

    // Main Ticking Logic
    function updateCountdown() {
      const now = new Date().getTime();
      const difference = TARGET_DATE.getTime() - now;

      if (difference <= 0 || isTestZero) {
        // Zero state triggered
        nameForm.style.display = 'none';
        timerSection.style.display = 'none';
        celebrationSection.style.display = 'flex';
        updateDisplayName();
        startCelebrationConfetti();
        return;
      }

      // Normal state
      nameForm.style.display = 'flex';
      timerSection.style.display = 'block';
      celebrationSection.style.display = 'none';
      stopConfetti();

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      daysEl.innerText = String(days).padStart(2, '0');
      hoursEl.innerText = String(hours).padStart(2, '0');
      minutesEl.innerText = String(minutes).padStart(2, '0');
      secondsEl.innerText = String(seconds).padStart(2, '0');
    }

    // Toggle Preview Zero
    testZeroBtn.addEventListener('click', function() {
      isTestZero = !isTestZero;
      testZeroBtn.innerText = isTestZero ? '⏱️ Return to Active Timer' : '⚡ Preview Celebration Mode';
      updateCountdown();
    });

    resetBtn.addEventListener('click', function() {
      isTestZero = false;
      testZeroBtn.innerText = '⚡ Preview Celebration Mode';
      updateCountdown();
    });

    // Initial run & interval
    updateDisplayName();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
